<span class="inline-flex items-center gap-1.5 font-mono text-[11px] text-[#86868B] select-none">
  <span class="text-[#1D1D1F] font-medium">{{ txHash | truncateHash: startChars : endChars }}</span>

  <!-- Copy Button -->
  <button
    type="button"
    (click)="copyToClipboard($event)"
    [title]="copied() ? 'Copiado' : 'Copiar hash'"
    class="text-[#86868B] hover:text-[#1D1D1F] transition-colors cursor-pointer p-0.5"
  >
    @if (copied()) {
      <span class="text-[#248A3D] text-[10px] font-sans font-medium">Copiado</span>
    } @else {
      <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
      </svg>
    }
  </button>

  <!-- External Explorer Link -->
  @if (txHash && showLink) {
    <a
      [href]="explorerUrl"
      target="_blank"
      rel="noopener noreferrer"
      title="Ver en Stellar Expert"
      class="text-[#86868B] hover:text-[#0071E3] transition-colors p-0.5"
    >
      <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
      </svg>
    </a>
  }
</span>
